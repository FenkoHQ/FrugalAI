{{define "usage.html"}}<div id="usage-section"
     hx-get="/admin/ui/partials/usage"
     hx-trigger="every 15s"
     hx-swap="outerHTML">
  <div class="section-head">
    <span class="section-title">Usage by model</span>
  </div>
  {{if .}}
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid var(--border)">
          <th style="padding:8px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">Model</th>
          <th style="padding:8px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">Req</th>
          <th style="padding:8px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">Tok in</th>
          <th style="padding:8px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">Tok out</th>
          <th style="padding:8px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">Fail</th>
        </tr>
      </thead>
      <tbody>
        {{range .}}<tr style="border-bottom:1px solid rgba(48,54,61,0.5)">
          <td style="padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:60%" title="{{.Model}}">{{.Model}}</td>
          <td style="padding:7px 14px;text-align:right;font-size:12px;color:var(--txt)">{{.Requests}}</td>
          <td style="padding:7px 14px;text-align:right;font-size:12px;color:var(--muted)">{{.TokensIn}}</td>
          <td style="padding:7px 14px;text-align:right;font-size:12px;color:var(--muted)">{{.TokensOut}}</td>
          <td style="padding:7px 14px;text-align:right;font-size:12px;{{if gt .Failures 0}}color:var(--err){{else}}color:var(--muted){{end}}">{{.Failures}}</td>
        </tr>{{end}}
      </tbody>
    </table>
  </div>
  {{else}}
  <div class="empty-state">No requests yet.</div>
  {{end}}
</div>{{end}}

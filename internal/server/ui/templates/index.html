{{define "index.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrugalAI — Fenko</title>
<script src="/admin/ui/static/htmx.min.js"></script>
<style>
:root {
  --bg:       #0D1117;
  --surface:  #161B22;
  --elevated: #1C2128;
  --border:   #30363D;
  --txt:      #E6EDF3;
  --muted:    #8B949E;
  --accent:   #F5A623;
  --accent-bg: rgba(245,166,35,0.12);
  --ok:       #3FB950;
  --warn:     #D29922;
  --err:      #F85149;
  --info:     #58A6FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #0D1117;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}
.logo-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--txt);
}
.logo-sep { color: var(--border); margin: 0 2px; }
.logo-product { color: var(--muted); font-weight: 400; }

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: auto 1fr;
  gap: 0;
  height: calc(100vh - 57px);
}
.sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.main {
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Stats bar ── */
.stats-bar {
  grid-column: 1 / -1;
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat-cell {
  flex: 1;
  padding: 10px 20px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat-value {
  font-size: 20px;
  font-weight: 600;
  color: var(--txt);
  font-family: Inter, sans-serif;
  letter-spacing: -0.5px;
}
.stat-value.accent { color: var(--accent); }

/* ── Section headings ── */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--elevated);
  color: var(--txt);
  font-size: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); background: var(--accent-bg); }
.btn-accent {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
}
.btn-sm { padding: 2px 8px; font-size: 11px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.htmx-request .btn { opacity: 0.6; pointer-events: none; }

/* ── Model card ── */
.model-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.model-id {
  font-family: "JetBrains Mono", "Fira Code", monospace;
  font-size: 12px;
  color: var(--accent);
  word-break: break-all;
  margin-bottom: 6px;
}
.model-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: "JetBrains Mono", monospace;
}

/* ── Candidate list ── */
.candidate {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: border-color 0.15s, background 0.15s;
}
.candidate:hover { background: var(--elevated); border-color: var(--border); }
.candidate.active {
  background: var(--accent-bg);
  border-color: rgba(245,166,35,0.3);
}
.candidate-name {
  font-size: 12px;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.candidate.active .candidate-name { color: var(--accent); font-weight: 500; }
.dot-active {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ok);
  flex-shrink: 0;
}

/* ── Log feed ── */
.log-feed {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  flex: 1;
}
.log-entry {
  display: grid;
  grid-template-columns: 88px 46px 1fr;
  gap: 10px;
  padding: 5px 14px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.6;
  align-items: baseline;
}
.log-entry:last-child { border-bottom: none; }
.log-entry:hover { background: var(--elevated); }
.log-time { color: var(--muted); white-space: nowrap; }
.log-level { font-weight: 600; white-space: nowrap; }
.log-level.DEBUG { color: var(--muted); }
.log-level.INFO  { color: var(--info); }
.log-level.WARN  { color: var(--warn); }
.log-level.ERROR { color: var(--err); }
.log-msg { color: var(--txt); word-break: break-all; }

.load-more {
  padding: 10px;
  text-align: center;
  border-top: 1px solid var(--border);
}

.empty-state {
  padding: 40px;
  text-align: center;
  color: var(--muted);
}
</style>
</head>
<body>

<header>
  <div class="logo-mark">F</div>
  <span class="logo-name">Fenko <span class="logo-sep">/</span> <span class="logo-product">FrugalAI</span></span>
</header>

<div class="layout">

  {{template "stats.html" .Stats}}

  <aside class="sidebar">
    <div id="model-section"
         hx-get="/admin/ui/partials/model"
         hx-trigger="every 30s"
         hx-swap="outerHTML">
      {{template "model.html" .Model}}
    </div>
  </aside>

  <main class="main">
    {{template "usage.html" .Usage}}
    <div>
      <div class="section-head">
        <span class="section-title">Logs</span>
        <button class="btn btn-sm"
                hx-get="/admin/ui/partials/logs?offset=0"
                hx-target="#log-entries"
                hx-swap="innerHTML">↺ Refresh</button>
      </div>
      <div class="log-feed">
        <div id="log-entries">
          {{template "logs.html" .Logs}}
        </div>
      </div>
    </div>
  </main>

</div>
</body>
</html>{{end}}
